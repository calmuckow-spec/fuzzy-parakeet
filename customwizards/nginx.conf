# Конфиг Nginx для статического сайта CustomWizards.
#
# Установка:
#   1. Скопируйте всю папку customwizards/ на сервер, например в /var/www/customwizards
#   2. Положите этот файл в /etc/nginx/sites-available/customwizards.conf
#   3. Поправьте server_name и root ниже под свой домен/путь
#   4. ln -s /etc/nginx/sites-available/customwizards.conf /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name customwizards.example;  # замените на свой домен или IP

    root /var/www/customwizards;        # путь к папке customwizards/ на сервере
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # статику (css/js/svg) можно кешировать надолго
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
